name: Build Win32 OpenSSH

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (x64 or arm64)'
        required: true
        default: 'x64'
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'

jobs:
  build-x64:
    runs-on: windows-latest

    env:
      CFLAGS: "/wd4815"
      CMAKE_C_FLAGS: "/wd4815"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch custom vcpkg triplet for libfido2 C4815
        shell: pwsh
        run: |
          $tripletName = "x64-custom"
          $candidates = @(
            "contrib\win32\openssh\triplets\$tripletName.cmake",
            "triplets\$tripletName.cmake",
            "contrib\win32\openssh\vcpkg_installed\$tripletName\x64-custom.cmake",
            "contrib\win32\openssh\vcpkg_installed\$tripletName.cmake"
          )

          $patched = $false
          $snippet = @'
          # Auto-injected for libfido2 C4815 compatibility with MSVC 14.52+
          if(PORT STREQUAL "libfido2")
              list(APPEND VCPKG_C_FLAGS "/wd4815")
              string(APPEND VCPKG_C_FLAGS_DEBUG " /wd4815")
              string(APPEND VCPKG_C_FLAGS_RELEASE " /wd4815")
          endif()
          '@

          foreach ($path in $candidates) {
            if (Test-Path $path) {
              $content = Get-Content -Path $path -Raw -ErrorAction SilentlyContinue
              if ($content -notmatch 'PORT STREQUAL "libfido2"') {
                Add-Content -Path $path -Value $snippet -Encoding UTF8
                Write-Host "Patched triplet: $path"
              } else {
                Write-Host "Already patched: $path"
              }
              $patched = $true
            }
          }

          if (-not $patched) {
            Write-Host "No matching triplet file found in preset candidates; relying on env flags."
          }

      - name: Build Win32-OpenSSH with OpenSSHBuildHelper
        shell: pwsh
        run: |
          Import-Module .\contrib\win32\openssh\OpenSSHBuildHelper.psm1 -Force

          $vsInstallPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * `
            -version "[18.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsInstallPath) {
            throw "Visual Studio 18 with x86/x64 VC++ tools not found."
          }

          $msbuild = Join-Path $vsInstallPath "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $slnPath = Join-Path $PWD "contrib\win32\openssh\Win32-OpenSSH.sln"
          $logPath = Join-Path $PWD "contrib\win32\openssh\OpenSSHReleasex64.log"

          Write-Host "Using MSBuild path: $msbuild"
          Write-Host "Starting Open SSH build; Build Log: $logPath."

          & $msbuild $slnPath `
            /t:Rebuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /m `
            /nologo `
            /fl `
            "/flp:LogFile=$logPath;Append;Verbosity=diagnostic" `
            /noconlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openssh-build-log-x64
          path: contrib\win32\openssh\OpenSSHReleasex64.log
