name: Build Win32-OpenSSH (x64)

on:
  push:
    branches: [ latestw_all ]
  pull_request:
    branches: [ latestw_all ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout openssh-portable
        uses: actions/checkout@v4
        with:
          path: openssh-portable
          submodules: recursive

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          # 移除 fetch-depth: 1，使用默认完整克隆
          # 完整历史是 vcpkg 解析 baseline 和 port tree 所必需的

      - name: Cache vcpkg downloads and installed tree
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/installed
            openssh-portable/contrib/win32/openssh/vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('openssh-portable/contrib/win32/openssh/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-

      - name: Install vcpkg dependencies for x64
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $vcpkgRoot = (Resolve-Path "..\vcpkg").Path
          $env:VCPKG_ROOT = $vcpkgRoot

          # （保留你原有的 libfido2 警告抑制逻辑）
          $fidoPortfile = "contrib\win32\openssh\vcpkg_overlay_ports\libfido2\portfile.cmake"
          if (Test-Path $fidoPortfile) {
            $content = Get-Content -Path $fidoPortfile -Raw
            if ($content -match "vcpkg_cmake_configure\s*\(" -and $content -notmatch "-wd4815") {
              $updated = [regex]::Replace(
                $content,
                "vcpkg_cmake_configure\s*\(",
                "vcpkg_cmake_configure(`r`n    OPTIONS`r`n        `"-DCMAKE_C_FLAGS=-wd4815`"`r`n",
                1
              )
              Set-Content -Path $fidoPortfile -Value $updated -NoNewline
            }
          }

          .\.github\tools\Install-VcpkgDependencies.ps1 -Bootstrap -Architecture x64
          if ($LASTEXITCODE -ne 0) {
            throw "Install-VcpkgDependencies.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Verify Visual Studio toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with C++ tools not found" }
          Write-Host "VS: $vsPath"

      - name: Build OpenSSH (x64 Release)
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $env:VCPKG_ROOT = (Resolve-Path "..\vcpkg").Path
          .\.github\tools\Start-OpenSSHBuild.ps1 -Configuration Release -Architecture x64

      - name: Inspect build log and warnings
        if: always()
        shell: pwsh
        working-directory: openssh-portable
        run: |
          .\.github\tools\Test-OpenSSHBuild.ps1 -Configuration Release -Architecture x64

      - name: Smoke test binaries
        if: success()
        shell: pwsh
        run: |
          $bin = "openssh-portable\bin\x64\Release"
          & "$bin\ssh.exe" -V
          & "$bin\sshd.exe" -V 2>&1 | Select-Object -First 1
          Write-Host "Smoke test passed"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openssh-win64-release
          path: |
            openssh-portable/bin/x64/Release/ssh.exe
            openssh-portable/bin/x64/Release/sshd.exe
            openssh-portable/bin/x64/Release/sshd-auth.exe
            openssh-portable/bin/x64/Release/sshd-session.exe
            openssh-portable/bin/x64/Release/ssh-agent.exe
            openssh-portable/bin/x64/Release/ssh-add.exe
            openssh-portable/bin/x64/Release/ssh-keygen.exe
            openssh-portable/bin/x64/Release/ssh-keyscan.exe
            openssh-portable/bin/x64/Release/scp.exe
            openssh-portable/bin/x64/Release/sftp.exe
            openssh-portable/bin/x64/Release/sftp-server.exe
            openssh-portable/bin/x64/Release/ssh-pkcs11-helper.exe
            openssh-portable/bin/x64/Release/ssh-shellhost.exe
            openssh-portable/bin/x64/Release/ssh-sk-helper.exe
