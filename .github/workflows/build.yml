name: Build Win32 OpenSSH

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (x64 or arm64)'
        required: true
        default: 'x64'
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Workaround libfido2 C4815 in overlay port
        shell: pwsh
        run: |
          $portfile = "contrib\win32\openssh\vcpkg_overlay_ports\libfido2\portfile.cmake"
          if (-not (Test-Path $portfile)) {
            throw "libfido2 portfile not found: $portfile"
          }

          $content = Get-Content -Path $portfile -Raw
          if ($content -notmatch 'wd4815') {
            $updated = $content -replace '(vcpkg_cmake_configure\([\s\S]*?OPTIONS\s*)', "`$1`n        -DCMAKE_C_FLAGS=`"/wd4815 /WX-`"`n        "
            if ($updated -eq $content) {
              $updated = $content -replace '(vcpkg_cmake_configure\([\s\S]*?)(\r?\n\))', "`$1`n    OPTIONS`n        -DCMAKE_C_FLAGS=`"/wd4815 /WX-`"`$2"
            }
            Set-Content -Path $portfile -Value $updated -Encoding UTF8
            Write-Host "Updated $portfile to suppress C4815 / disable /WX for libfido2"
          }

      - name: Install vcpkg and dependencies
        shell: pwsh
        run: |
          $arch = "${{ inputs.arch }}"
          $triplet = "$arch-custom"
          $repoRoot = $PWD.Path
          $vcpkgDir = Join-Path (Split-Path $repoRoot -Parent) "vcpkg"

          if (-not (Test-Path $vcpkgDir)) {
            git clone https://github.com/Microsoft/vcpkg.git $vcpkgDir
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone vcpkg into $vcpkgDir"
            }
          }

          $vcpkgExe = Join-Path $vcpkgDir "vcpkg.exe"
          if (-not (Test-Path $vcpkgExe)) {
            & (Join-Path $vcpkgDir "bootstrap-vcpkg.bat")
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap vcpkg"
            }
          }

          $sshDir = Join-Path $repoRoot "contrib\win32\openssh"
          $installedRoot = Join-Path $sshDir "vcpkg_installed"

          Push-Location $sshDir
          try {
            & $vcpkgExe install `
              --triplet $triplet `
              --x-install-root=$installedRoot `
              --overlay-triplets=.\vcpkg_triplets `
              --overlay-ports=.\vcpkg_overlay_ports
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg install failed for triplet $triplet"
            }
          }
          finally {
            Pop-Location
          }

          $expectedDll = Join-Path $installedRoot "$triplet\$triplet\bin\libcrypto.dll"
          if (-not (Test-Path $expectedDll)) {
            $foundDll = Get-ChildItem (Split-Path $repoRoot -Parent) -Filter "libcrypto.dll" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\debug\\' } |
              Select-Object -First 1

            if (-not $foundDll) {
              $foundDll = Get-ChildItem (Split-Path $repoRoot -Parent) -Filter "libcrypto.dll" -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($foundDll) {
              $targetDir = Split-Path $expectedDll -Parent
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
              Copy-Item -Path $foundDll.FullName -Destination $expectedDll -Force
              Write-Host "Copied $($foundDll.FullName) -> $expectedDll"
            } else {
              throw "libcrypto.dll was not produced anywhere under $(Split-Path $repoRoot -Parent)"
            }
          } else {
            Write-Host "Found expected DLL at $expectedDll"
          }

      - name: Build Win32-OpenSSH
        shell: pwsh
        run: |
          $arch = "${{ inputs.arch }}"
          $config = "${{ inputs.configuration }}"

          Import-Module .\contrib\win32\openssh\OpenSSHBuildHelper.psm1 -Force

          $vsInstallPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * `
            -version "[18.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsInstallPath) {
            throw "Visual Studio 18 with x86/x64 VC++ tools not found."
          }

          $msbuild = Join-Path $vsInstallPath "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $slnPath = Join-Path $PWD "contrib\win32\openssh\Win32-OpenSSH.sln"
          $logPath = Join-Path $PWD "contrib\win32\openssh\OpenSSH${config}${arch}.log"

          Write-Host "Using MSBuild path: $msbuild"
          Write-Host "Starting Open SSH build ($arch / $config); Build Log: $logPath"

          & $msbuild $slnPath `
            /t:Rebuild `
            "/p:Platform=$arch" `
            "/p:Configuration=$config" `
            /m `
            /nologo `
            /fl `
            "/flp:LogFile=$logPath;Append;Verbosity=diagnostic" `
            /noconlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openssh-build-log-${{ inputs.arch }}-${{ inputs.configuration }}
          path: contrib\win32\openssh\OpenSSH${{ inputs.configuration }}${{ inputs.arch }}.log
