name: Build Win32 OpenSSH

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (x64 or arm64)'
        required: true
        default: 'x64'
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Workaround libfido2 C4815 in overlay port
        shell: pwsh
        run: |
          $portfile = "contrib\win32\openssh\vcpkg_overlay_ports\libfido2\portfile.cmake"
          if (-not (Test-Path $portfile)) {
            throw "libfido2 portfile not found: $portfile"
          }

          $content = Get-Content -Path $portfile -Raw
          if ($content -notmatch 'wd4815') {
            $updated = $content -replace '(vcpkg_cmake_configure\([\s\S]*?OPTIONS\s*)', "`$1`n        -DCMAKE_C_FLAGS=`"/wd4815 /WX-`"`n        "
            if ($updated -eq $content) {
              $updated = $content -replace '(vcpkg_cmake_configure\([\s\S]*?)(\r?\n\))', "`$1`n    OPTIONS`n        -DCMAKE_C_FLAGS=`"/wd4815 /WX-`"`$2"
            }
            Set-Content -Path $portfile -Value $updated -Encoding UTF8
            Write-Host "Updated $portfile to suppress C4815 / disable /WX for libfido2"
          }

      - name: Install vcpkg and dependencies
        shell: pwsh
        run: |
          $arch = "${{ inputs.arch }}"
          $triplet = "$arch-custom"
          $repoRoot = $PWD.Path
          $vcpkgDir = Join-Path (Split-Path $repoRoot -Parent) "vcpkg"

          if (-not (Test-Path $vcpkgDir)) {
            git clone https://github.com/Microsoft/vcpkg.git $vcpkgDir
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone vcpkg into $vcpkgDir"
            }
          }

          $vcpkgExe = Join-Path $vcpkgDir "vcpkg.exe"
          if (-not (Test-Path $vcpkgExe)) {
            & (Join-Path $vcpkgDir "bootstrap-vcpkg.bat")
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap vcpkg"
            }
          }

          $sshDir = Join-Path $repoRoot "contrib\win32\openssh"
          $installedRoot = Join-Path $sshDir "vcpkg_installed"

          Push-Location $sshDir
          try {
            & $vcpkgExe install `
              --triplet $triplet `
              --x-install-root=$installedRoot `
              --overlay-triplets=.\vcpkg_triplets `
              --overlay-ports=.\vcpkg_overlay_ports
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg install failed for triplet $triplet"
            }
          }
          finally {
            Pop-Location
          }

          $expectedDll = Join-Path $installedRoot "$triplet\$triplet\bin\libcrypto.dll"
          if (-not (Test-Path $expectedDll)) {
            $foundDll = Get-ChildItem (Split-Path $repoRoot -Parent) -Filter "libcrypto.dll" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\debug\\' } |
              Select-Object -First 1

            if (-not $foundDll) {
              $foundDll = Get-ChildItem (Split-Path $repoRoot -Parent) -Filter "libcrypto.dll" -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($foundDll) {
              $targetDir = Split-Path $expectedDll -Parent
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
              Copy-Item -Path $foundDll.FullName -Destination $expectedDll -Force
              Write-Host "Copied $($foundDll.FullName) -> $expectedDll"
            } else {
              throw "libcrypto.dll was not produced anywhere under $(Split-Path $repoRoot -Parent)"
            }
          } else {
            Write-Host "Found expected DLL at $expectedDll"
          }

      - name: Build Win32-OpenSSH
        shell: pwsh
        working-directory: contrib/win32/openssh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = Get-ChildItem -Path $sdkDir -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $sdkVer) {
            Write-Error "No Windows 10/11 SDK found under $sdkDir"
            exit 1
          }
          Write-Host "Using WindowsTargetPlatformVersion: $sdkVer"

          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = $null
          if (Test-Path $vsWhere) {
            $vsInstallPath = (& $vsWhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1)
          }
          if (-not $vsInstallPath) {
            $vsInstallPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          }

          $devCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (Test-Path $devCmd) {
            Write-Host "Loading environment via: $devCmd"
            cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              }
            }
          }

          if (-not (Get-Command msbuild -ErrorAction SilentlyContinue)) {
            $msbuildExe = Get-ChildItem -Path $vsInstallPath -Filter "MSBuild.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\amd64\\' -or $_.FullName -match '\\Bin\\' } |
              Select-Object -First 1 -ExpandProperty FullName
            if ($msbuildExe) {
              $msbuildDir = Split-Path $msbuildExe -Parent
              $env:PATH = "$msbuildDir;$env:PATH"
            }
          }

          # 1. Locate existing x64 OpenSSL include/lib
          $sslHeader = Get-ChildItem -Path @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\OpenSSL-Win64",
            "C:\vcpkg\installed\x64-windows",
            "D:\a"
          ) -Filter "opensslv.h" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          # 2. If not found, install Shining Light Win64 OpenSSL via winget
          if (-not $sslHeader -and (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Win64 OpenSSL via winget..."
            winget install --id ShiningLight.OpenSSL.Light -e --accept-source-agreements --accept-package-agreements --silent | Out-Null
            $sslHeader = Get-ChildItem -Path @(
              "C:\Program Files\OpenSSL-Win64",
              "C:\OpenSSL-Win64"
            ) -Filter "opensslv.h" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $sslHeader) {
            Write-Error "openssl/opensslv.h not found and automatic install failed."
            exit 1
          }

          # opensslv.h is usually <root>\include\openssl\opensslv.h
          $opensslInclude = Split-Path (Split-Path $sslHeader.FullName -Parent) -Parent
          $opensslRoot = Split-Path $opensslInclude -Parent
          $opensslLib = Join-Path $opensslRoot "lib\VC\x64\MD"
          if (-not (Test-Path $opensslLib)) {
            $opensslLib = Join-Path $opensslRoot "lib"
          }

          Write-Host "Found OpenSSL root: $opensslRoot"
          Write-Host "Found OpenSSL include: $opensslInclude"

          $env:OPENSSL_DIR = $opensslRoot
          $env:OPENSSL_ROOT_DIR = $opensslRoot
          if ($env:INCLUDE -notlike "*$opensslInclude*") {
            $env:INCLUDE = "$opensslInclude;$env:INCLUDE"
          }
          if ($env:LIB -notlike "*$opensslLib*") {
            $env:LIB = "$opensslLib;$env:LIB"
          }

          $logFile = "OpenSSHReleasex64.log"
          msbuild Win32-OpenSSH.sln `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=$sdkVer `
            /p:ExternalIncludePath="$opensslInclude;$env:ExternalIncludePath" `
            /fl `
            /flp:LogFile=$logFile`;Verbosity=normal

          $msbuildExit = $LASTEXITCODE
          if ($msbuildExit -ne 0) {
            Write-Host "=== MSBuild failed with exit code $msbuildExit ==="
            if (Test-Path $logFile) {
              Write-Host "--- First error matches ---"
              Select-String -Path $logFile -Pattern ":\s*(fatal )?error\s+[A-Z0-9]+:|error MSB\d+:" -Context 2,2 |
                Select-Object -First 40
              Write-Host "--- Log tail (last 60 lines) ---"
              Get-Content -Path $logFile -Tail 60
            }
            exit $msbuildExit
          }

      - name: Upload MSBuild Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: contrib/win32/openssh/OpenSSHReleasex64.log
          if-no-files-found: ignore
