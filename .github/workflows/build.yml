name: Build Win32-OpenSSH (x64)

on:
  push:
    branches: [ latestw_all ]
  pull_request:
    branches: [ latestw_all ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository into openssh-portable
        uses: actions/checkout@v4
        with:
          path: openssh-portable
          submodules: recursive

      - name: Checkout vcpkg sibling repository
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Install vcpkg dependencies for x64
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $env:VCPKG_ROOT = (Resolve-Path "..\vcpkg").Path
          $result = .\.github\tools\Install-VcpkgDependencies.ps1 -Bootstrap -Architecture x64
          if ($result -and $result.ContainsKey("Success") -and -not $result.Success) {
            throw "Install-VcpkgDependencies.ps1 failed: $($result.Errors -join '; ')"
          }

      - name: Build OpenSSH (x64 Release)
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $env:VCPKG_ROOT = (Resolve-Path "..\vcpkg").Path
          .\.github\tools\Start-OpenSSHBuild.ps1 -Configuration Release -Architecture x64

      - name: Inspect build log and warnings
        if: always()
        shell: pwsh
        working-directory: openssh-portable
        run: |
          .\.github\tools\Test-OpenSSHBuild.ps1 -Configuration Release -Architecture x64

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openssh-win64-release
          path: |
            openssh-portable/bin/x64/Release/**
            openssh-portable/contrib/win32/openssh/x64/Release/**
            !**/.*.pdb
