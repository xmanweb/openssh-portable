name: Build Win32-OpenSSH (x64)

on:
  push:
    branches: [ latestw_all ]
  pull_request:
    branches: [ latestw_all ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout openssh-portable
        uses: actions/checkout@v4
        with:
          path: openssh-portable
          submodules: recursive

      - name: Checkout vcpkg (full history)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Cache vcpkg downloads and installed tree
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/installed
            openssh-portable/contrib/win32/openssh/vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('openssh-portable/contrib/win32/openssh/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-

      - name: Install vcpkg dependencies for x64
        shell: pwsh
        working-directory: openssh-portable
        continue-on-error: true
        run: |
          $vcpkgRoot = (Resolve-Path "..\vcpkg").Path
          $env:VCPKG_ROOT = $vcpkgRoot

          $fidoPortfile = "contrib\win32\openssh\vcpkg_overlay_ports\libfido2\portfile.cmake"
          if (Test-Path $fidoPortfile) {
            $content = Get-Content -Path $fidoPortfile -Raw
            if ($content -match "vcpkg_cmake_configure\s*\(" -and $content -notmatch "-wd4815") {
              $updated = [regex]::Replace(
                $content,
                "vcpkg_cmake_configure\s*\(",
                "vcpkg_cmake_configure(`r`n    OPTIONS`r`n        `"-DCMAKE_C_FLAGS=-wd4815`"`r`n",
                1
              )
              Set-Content -Path $fidoPortfile -Value $updated -NoNewline
            }
          }

          .\.github\tools\Install-VcpkgDependencies.ps1 -Bootstrap -Architecture x64
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Install-VcpkgDependencies.ps1 exited with $LASTEXITCODE; deferring to libcrypto.dll verification step."
          }

      - name: Normalize and verify libcrypto.dll
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $vcpkgInstalled = "contrib\win32\openssh\vcpkg_installed"
          $triplet = "x64-custom"

          if (-not (Test-Path $vcpkgInstalled)) {
            throw "vcpkg_installed directory not found: $vcpkgInstalled"
          }

          $libcrypto = Get-ChildItem -Path $vcpkgInstalled -Filter "libcrypto.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libcrypto) {
            Write-Host "Contents of vcpkg_installed (depth 4):"
            Get-ChildItem -Path $vcpkgInstalled -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName
            throw "libcrypto.dll not found under $vcpkgInstalled. vcpkg install genuinely failed."
          }
          Write-Host "Found libcrypto.dll at: $($libcrypto.FullName)"

          $expectedDir = Join-Path $vcpkgInstalled "$triplet\$triplet\bin"
          New-Item -ItemType Directory -Force -Path $expectedDir | Out-Null

          $dllPatterns = @("libcrypto.dll", "libssl*.dll", "tls*.dll", "libcbor*.dll", "libfido2*.dll", "zlib*.dll")
          foreach ($pattern in $dllPatterns) {
            Get-ChildItem -Path $vcpkgInstalled -Filter $pattern -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              ForEach-Object {
                $dest = Join-Path $expectedDir $_.Name
                if ($_.FullName -ne $dest) {
                  Copy-Item $_.FullName -Destination $dest -Force
                  Write-Host "Copied $($_.Name) -> $expectedDir"
                }
              }
          }

          $outDir = "bin\x64\Release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Get-ChildItem -Path $expectedDir -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $outDir -Force
          }
          Write-Host "Runtime DLLs staged in $outDir"

      # 核心修复：直接向 .vcxproj 的 ClCompile / Link 条目注入 vcpkg 绝对路径
      - name: Patch vcxproj files with vcpkg include/lib
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $vcpkgRoot    = (Resolve-Path "contrib\win32\openssh\vcpkg_installed\x64-custom").Path
          $vcpkgInclude = Join-Path $vcpkgRoot "include"
          $vcpkgLib     = Join-Path $vcpkgRoot "lib"

          if (-not (Test-Path $vcpkgInclude)) { throw "vcpkg include not found: $vcpkgInclude" }
          if (-not (Test-Path $vcpkgLib))     { throw "vcpkg lib not found: $vcpkgLib" }

          Write-Host "vcpkg include: $vcpkgInclude"
          Write-Host "vcpkg lib    : $vcpkgLib"

          $vcxprojs = Get-ChildItem "contrib\win32\openssh\*.vcxproj"
          foreach ($proj in $vcxprojs) {
            $raw = Get-Content $proj.FullName -Raw
            $changed = $false

            # 在 ItemDefinitionGroup 的 ClCompile 下注入 AdditionalIncludeDirectories
            if ($raw -match '<ClCompile>') {
              if ($raw -match '<AdditionalIncludeDirectories>(.*?)</AdditionalIncludeDirectories>') {
                $existing = $Matches[1]
                if ($existing -notlike "*$vcpkgInclude*") {
                  $raw = $raw -replace '<AdditionalIncludeDirectories>(.*?)</AdditionalIncludeDirectories>',
                                     "<AdditionalIncludeDirectories>$vcpkgInclude;`$1</AdditionalIncludeDirectories>"
                  $changed = $true
                }
              } else {
                # ClCompile 下没有 AdditionalIncludeDirectories，则在 <ClCompile> 后插入
                $raw = $raw -replace '(<ClCompile>)',
                                     "`$1`r`n      <AdditionalIncludeDirectories>$vcpkgInclude;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>"
                $changed = $true
              }
            }

            # 在 ItemDefinitionGroup 的 Link 下注入 AdditionalLibraryDirectories
            if ($raw -match '<Link>') {
              if ($raw -match '<AdditionalLibraryDirectories>(.*?)</AdditionalLibraryDirectories>') {
                $existing = $Matches[1]
                if ($existing -notlike "*$vcpkgLib*") {
                  $raw = $raw -replace '<AdditionalLibraryDirectories>(.*?)</AdditionalLibraryDirectories>',
                                     "<AdditionalLibraryDirectories>$vcpkgLib;`$1</AdditionalLibraryDirectories>"
                  $changed = $true
                }
              } else {
                $raw = $raw -replace '(<Link>)',
                                     "`$1`r`n      <AdditionalLibraryDirectories>$vcpkgLib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>"
                $changed = $true
              }
            }

            if ($changed) {
              Set-Content $proj.FullName -Value $raw -NoNewline -Encoding utf8NoBOM
              Write-Host "Patched: $($proj.Name)"
            } else {
              Write-Host "Skipped (already contains vcpkg paths or no target elements): $($proj.Name)"
            }
          }

          # 验证注入结果
          Write-Host "`n===== Verification: include path in libssh.vcxproj ====="
          Select-String -Path "contrib\win32\openssh\libssh.vcxproj" -Pattern "AdditionalIncludeDirectories" -Context 0,1

      - name: Build OpenSSH (x64 Release)
        id: build
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $env:VCPKG_ROOT = (Resolve-Path "..\vcpkg").Path
          .\.github\tools\Start-OpenSSHBuild.ps1 -Configuration Release -Architecture x64

      - name: Show MSBuild errors
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $log = "contrib\win32\openssh\OpenSSHReleasex64.log"
          if (Test-Path $log) {
            Write-Host "===== MSBuild errors ====="
            Select-String -Path $log -Pattern "error\s+[A-Z]+\d+|fatal error" -Context 0,2 |
              Select-Object -Last 100
            Write-Host "`n===== Last 200 lines of build log ====="
            Get-Content $log -Tail 200
          } else {
            Write-Warning "Build log not found: $log"
          }

      - name: Inspect build log and warnings
        if: always()
        shell: pwsh
        working-directory: openssh-portable
        run: |
          .\.github\tools\Test-OpenSSHBuild.ps1 -Configuration Release -Architecture x64

      - name: Smoke test binaries
        if: success()
        shell: pwsh
        working-directory: openssh-portable
        run: |
          $bin = "bin\x64\Release"
          $required = @(
            "ssh.exe", "sshd.exe", "sshd-auth.exe", "sshd-session.exe",
            "ssh-agent.exe", "ssh-add.exe", "ssh-keygen.exe", "ssh-keyscan.exe",
            "scp.exe", "sftp.exe", "sftp-server.exe",
            "ssh-pkcs11-helper.exe", "ssh-shellhost.exe", "ssh-sk-helper.exe"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bin $_)) }
          if ($missing) { throw "Missing expected binaries: $($missing -join ', ')" }

          & "$bin\ssh.exe" -V
          if ($LASTEXITCODE -ne 0) { throw "ssh.exe -V failed" }
          Write-Host "Smoke test passed"
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openssh-win64-release
          if-no-files-found: error
          retention-days: 14
          path: |
            openssh-portable/bin/x64/Release/**
    
