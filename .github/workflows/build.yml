name: Build Win32 OpenSSH

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (x64 or arm64)'
        required: true
        default: 'x64'
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        default: 'Release'

jobs:
  build:
    runs-on: windows-latest

    env:
      CFLAGS: "/wd4815"
      CMAKE_C_FLAGS: "/wd4815"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $arch = "${{ inputs.arch }}"
          .\.github\tools\Install-VcpkgDependencies.ps1 -Bootstrap -Architecture $arch

      - name: Patch custom vcpkg triplet for libfido2 C4815
        shell: pwsh
        run: |
          $arch = "${{ inputs.arch }}"
          $tripletFile = "contrib\win32\openssh\vcpkg_triplets\$arch-custom.cmake"

          if (-not (Test-Path $tripletFile)) {
            throw "Triplet file not found: $tripletFile"
          }

          $content = Get-Content -Path $tripletFile -Raw
          if ($content -notmatch 'PORT STREQUAL "libfido2"') {
            @(
              ""
              "# Suppress C4815 for libfido2 on newer MSVC"
              'if(PORT STREQUAL "libfido2")'
              '    list(APPEND VCPKG_C_FLAGS "/wd4815")'
              '    string(APPEND VCPKG_C_FLAGS_DEBUG " /wd4815")'
              '    string(APPEND VCPKG_C_FLAGS_RELEASE " /wd4815")'
              "endif()"
            ) | Add-Content -Path $tripletFile -Encoding UTF8
            Write-Host "Patched $tripletFile"
          } else {
            Write-Host "Already patched $tripletFile"
          }

      - name: Build Win32-OpenSSH with OpenSSHBuildHelper
        shell: pwsh
        run: |
          $arch = "${{ inputs.arch }}"
          $config = "${{ inputs.configuration }}"

          Import-Module .\contrib\win32\openssh\OpenSSHBuildHelper.psm1 -Force

          $vsInstallPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * `
            -version "[18.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsInstallPath) {
            throw "Visual Studio 18 with x86/x64 VC++ tools not found."
          }

          $msbuild = Join-Path $vsInstallPath "MSBuild\Current\Bin\amd64\MSBuild.exe"
          $slnPath = Join-Path $PWD "contrib\win32\openssh\Win32-OpenSSH.sln"
          $logPath = Join-Path $PWD "contrib\win32\openssh\OpenSSH${config}${arch}.log"

          Write-Host "Using MSBuild path: $msbuild"
          Write-Host "Starting Open SSH build ($arch / $config); Build Log: $logPath"

          & $msbuild $slnPath `
            /t:Rebuild `
            "/p:Platform=$arch" `
            "/p:Configuration=$config" `
            /m `
            /nologo `
            /fl `
            "/flp:LogFile=$logPath;Append;Verbosity=diagnostic" `
            /noconlog

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openssh-build-log-${{ inputs.arch }}-${{ inputs.configuration }}
          path: contrib\win32\openssh\OpenSSH${{ inputs.configuration }}${{ inputs.arch }}.log
